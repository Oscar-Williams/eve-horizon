
# Builds every service image without pushing, so a broken Dockerfile fails on the
# PR that breaks it rather than on the release tag that needs it.
#
# `ci.yml` only runs `pnpm build` + unit tests — it never exercises a Dockerfile.
# That gap meant image breakage could sit on `main` undetected until someone cut
# a `release-v*` tag and watched Publish Images fail.
#
# Build-only: no registry login, no credentials, no push. Uses the GitHub Actions
# cache rather than a registry cache so it works on fork PRs too.
name: Image Build Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/image-build-check.yml'
      - '.github/workflows/publish-images.yml'
      - '.github/workflows/toolchain-images.yml'
      - 'scripts/release/**'
      - 'tests/release/**'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/image-build-check.yml'
      - '.github/workflows/publish-images.yml'
      - '.github/workflows/toolchain-images.yml'
      - 'scripts/release/**'
      - 'tests/release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            target: production
          - service: sso
            dockerfile: apps/sso/Dockerfile
            target: production
          - service: gateway
            dockerfile: apps/gateway/Dockerfile
            target: production
          - service: agent-runtime
            dockerfile: apps/agent-runtime/Dockerfile
            target: production
          - service: orchestrator
            dockerfile: apps/orchestrator/Dockerfile
            target: production
          - service: worker
            dockerfile: apps/worker/Dockerfile
            target: base
          - service: dashboard
            dockerfile: apps/dashboard/Dockerfile
            target: production
          - service: migrate
            dockerfile: packages/migrate/Dockerfile
            target: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Mirrors publish-images.yml: same dockerfile, same target, same platform.
      # Keep the two matrices in sync — this check is only meaningful if it
      # builds what the release actually builds.
      - name: Build (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: ${{ matrix.service == 'migrate' || matrix.service == 'worker' }}
          tags: eve-horizon/${{ matrix.service }}:check
          build-args: |
            EVE_BUILD_VERSION=0.0.0-check
            EVE_BUILD_SHA=${{ github.sha }}
            EVE_BUILD_TIME=1970-01-01T00:00:00Z
          cache-from: type=gha,scope=image-check-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=image-check-${{ matrix.service }}
          platforms: linux/amd64

      # Same check the release gate runs on the frozen migrate artifact.
      - name: Numeric non-root user and a clean start (migrate)
        if: matrix.service == 'migrate'
        run: bash -c 'source scripts/release/common.sh && release_check_migrate_image eve-horizon/migrate:check'

      # Same check the release gate runs on the frozen worker artifact.
      - name: Runner pods' non-dumpable preload (worker)
        if: matrix.service == 'worker'
        run: bash -c 'source scripts/release/common.sh && release_check_worker_nodump eve-horizon/worker:check'

  # The release scripts' own tests: image references, tag validation, frozen
  # artifacts, ancestry and the publisher topology. Docker is mocked.
  release-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Release script and workflow topology tests
        run: bash scripts/release/check.sh

  # Build-only browser gate uses source toolchains. Fork PRs need no registry token.
  browser-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Native browser launch in both source-built runtime bases
        run: docker/toolchains/browser/test-runtime.sh

  toolchain-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [python, media, rust, java, kotlin, browser]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build toolchain without credentials
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: docker/toolchains/${{ matrix.name }}
          file: docker/toolchains/${{ matrix.name }}/Dockerfile
          platforms: linux/amd64
          push: false

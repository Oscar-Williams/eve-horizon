name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Supply chain gate
        run: node scripts/check-supply-chain.mjs

      - name: Supply chain gate tests
        run: node --test scripts/__tests__/check-supply-chain.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: API list response contract gate
        run: pnpm check:api-list-responses

      - name: OpenAPI contract gate
        run: node packages/cli/dist/index.js api diff --exit-code

      - name: Test
        run: pnpm test

name: Kubectl Context Safety

on:
  pull_request:
    branches: [main]
    paths:
      - "bin/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  lint-kubectl-context-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint kubectl context safety
        run: ./scripts/lint-kubectl-context-safety.sh

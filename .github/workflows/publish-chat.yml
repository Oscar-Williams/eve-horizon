name: Publish Chat SDK

on:
  push:
    tags:
      - 'chat-v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/chat-v}" >> $GITHUB_OUTPUT

      - name: Update package versions
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd packages/chat
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          cd ../chat-react
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish @eve-horizon/chat
        run: pnpm --filter @eve-horizon/chat publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @eve-horizon/chat-react
        run: pnpm --filter @eve-horizon/chat-react publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

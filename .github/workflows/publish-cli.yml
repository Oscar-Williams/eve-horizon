name: Publish CLI

# Publishing needs the tagged commit on main or a hotfix/* branch and an
# approval in the protected `release` environment (docs/system/ci-cd.md).
on:
  push:
    tags:
      - 'cli-v*'

jobs:
  ancestry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish only commits on main or a hotfix branch
        run: bash scripts/release/ancestry.sh "$GITHUB_SHA"

  publish:
    needs: ancestry
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Extract version from tag
        id: version
        run: |
          version=$(bash scripts/release/validate-tag.sh cli)
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Update CLI version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd packages/cli
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: pnpm --filter @eve-horizon/cli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

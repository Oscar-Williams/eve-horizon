name: Publish CLI

# Publishing needs the tagged commit on main or a hotfix/* branch and an
# approval in the protected `release` environment (docs/system/ci-cd.md).
on:
  push:
    tags:
      - 'cli-v*'

jobs:
  ancestry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Supply chain gate
        run: node scripts/check-supply-chain.mjs

      - name: Supply chain gate tests
        run: node --test scripts/__tests__/check-supply-chain.test.mjs

      - name: Publish only commits on main or a hotfix branch
        run: bash scripts/release/ancestry.sh "$GITHUB_SHA"

  # Builds and packs without the identity token npm trusts: install and
  # build scripts run here.
  pack:
    needs: ancestry
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Extract version from tag
        id: version
        run: |
          version=$(bash scripts/release/validate-tag.sh cli)
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Update CLI version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd packages/cli
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Pack @eve-horizon/cli
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP/packages"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Publishes the packed tarballs by npm trusted publishing: npm exchanges
  # this job's identity token for a short-lived publish token. It runs none
  # of the repository's code (docs/system/ci-cd.md).
  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write # npm trusted publishing

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install npm for trusted publishing
        # npm publishes with an identity token from 11.5.1 on; Node 22 ships
        # npm 10.
        run: npm install --global npm@11.21.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages
          path: ${{ runner.temp }}/packages

      - name: Publish @eve-horizon/cli
        run: npm publish "$RUNNER_TEMP"/packages/eve-horizon-cli-[0-9]*.tgz --access public --ignore-scripts

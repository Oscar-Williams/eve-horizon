name: Publish Images

# Release tags publish seven immutable service artifacts; deployment is owned elsewhere.
# Publishing needs the tagged commit on main or a hotfix/* branch and an
# approval in the protected `release` environment. Each pushed digest is
# signed keyless with this workflow's identity and gets a build provenance
# attestation (docs/system/ci-cd.md).
on:
  push:
    tags: ['release-v*']
  workflow_dispatch: # Full build and native gate only; never publishes.

permissions: {}
concurrency:
  group: service-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ancestry:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish only commits on main or a hotfix branch
        if: github.event_name == 'push'
        run: bash scripts/release/ancestry.sh "$GITHUB_SHA"

  version:
    needs: ancestry
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            value=$(bash scripts/release/validate-tag.sh service)
          else
            value=0.0.0
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: Freeze ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        name: [api, sso, gateway, agent-runtime, orchestrator, worker, dashboard]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build one AMD64 image and archive its exact identity
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ needs.version.outputs.value }}
        run: bash scripts/release/image.sh build service "$NAME" "$VERSION" "release-artifact/$NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-${{ matrix.name }}
          path: release-artifact/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  native-gate:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: service-worker
          path: release-artifact/worker
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: service-agent-runtime
          path: release-artifact/agent-runtime
      - name: Test exact worker and agent artifacts with digest-resolved versioned toolchains
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: bash scripts/release/gate.sh service "$VERSION" release-artifact

      - name: Preserve native gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-browser-gate-${{ github.run_id }}
          path: /tmp/eve-browser-release-evidence/*.log
          if-no-files-found: warn
          retention-days: 30

  prepublish:
    if: github.event_name == 'push'
    needs: [ancestry, version, native-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject any existing version before the first push
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          bash scripts/release/validate-tag.sh service
          bash scripts/release/prepublish.sh service "$VERSION"

  publish:
    if: github.event_name == 'push'
    needs: [ancestry, version, native-gate, prepublish]
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        name: [api, sso, gateway, agent-runtime, orchestrator, worker, dashboard]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: service-${{ matrix.name }}
          path: release-artifact/${{ matrix.name }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the frozen archive once, after all builds and the native gate
        id: push
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          bash scripts/release/validate-tag.sh service
          bash scripts/release/image.sh publish service "$NAME" "$VERSION" "release-artifact/$NAME"
          cat "release-artifact/$NAME/published.txt" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the pushed digest
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

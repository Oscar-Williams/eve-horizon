name: Publish Auth SDK

# Publishing needs the tagged commit on main or a hotfix/* branch and an
# approval in the protected `release` environment (docs/system/ci-cd.md).
on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  ancestry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Supply chain gate
        run: node scripts/check-supply-chain.mjs

      - name: Supply chain gate tests
        run: node --test scripts/__tests__/check-supply-chain.test.mjs

      - name: Publish only commits on main or a hotfix branch
        run: bash scripts/release/ancestry.sh "$GITHUB_SHA"

  publish:
    needs: ancestry
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write # npm trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm for trusted publishing
        # pnpm publish hands the upload to npm, which publishes with this
        # job's identity token from 11.5.1 on; Node 22 ships npm 10.
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Extract version from tag
        id: version
        run: |
          version=$(bash scripts/release/validate-tag.sh sdk)
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Update package versions
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd packages/auth
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          cd ../auth-react
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish @eve-horizon/auth
        run: pnpm --filter @eve-horizon/auth publish --access public --no-git-checks

      - name: Publish @eve-horizon/auth-react
        run: pnpm --filter @eve-horizon/auth-react publish --access public --no-git-checks

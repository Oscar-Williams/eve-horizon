apiVersion: v1
kind: Secret
metadata:
  name: eve-app
  namespace: eve
type: Opaque
# Platform-only secrets — infrastructure keys required by Eve services.
#
# Everything else (LLM API keys, GitHub tokens, GHCR credentials, etc.)
# flows through Eve org/project-level secrets, resolved at runtime via
# the secrets API. Never add provider credentials here.
stringData:
  # `eve local up` writes every value below it generates (packages/cli
  # src/commands/local.ts, localPlatformSecrets); each service takes only the
  # keys it reads, by secretKeyRef, as in k8s/base.
  # The database URL, with the packaged stack's local-only Postgres password.
  DATABASE_URL: ""
  # Internal service keys: the core key (API, worker, orchestrator, agent
  # runtime), the gateway's and the SSO's own, the deliver key the API sends
  # the gateway, and `core:<sha256>,gateway:<sha256>,sso:<sha256>,deliver:<sha256>`
  # for callees that accept a key without holding it.
  EVE_INTERNAL_CORE_KEY: ""
  EVE_INTERNAL_GATEWAY_KEY: ""
  EVE_INTERNAL_SSO_KEY: ""
  EVE_INTERNAL_DELIVER_KEY: ""
  EVE_INTERNAL_CALLER_HASHES: ""
  # Signs registry pull and push credentials (API and worker only; required by both).
  EVE_REGISTRY_CREDENTIAL_KEY: ""
  EVE_INTERNAL_API_KEY: ""
  EVE_SECRETS_MASTER_KEY: ""
  EVE_BOOTSTRAP_TOKEN: ""
  EVE_GITHUB_WEBHOOK_SECRET: ""
  # --- Supabase Auth (GoTrue) ---
  SUPABASE_JWT_SECRET: ""
  EVE_AUTH_ADMIN_PASSWORD: ""
  SUPABASE_AUTH_DATABASE_URL: ""
  SUPABASE_AUTH_SERVICE_KEY: ""
  SUPABASE_ANON_KEY: ""

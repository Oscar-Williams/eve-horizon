apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-gateway
  namespace: eve
  labels:
    app.kubernetes.io/name: eve-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-gateway
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          securityContext:
            allowPrivilegeEscalation: false
          image: eve-horizon/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4820
          env:
            # Platform secrets: the gateway's own key, and the hashes of the keys it
            # accepts (the deliver key, for deliveries), as in k8s/base. No database
            # URL and no core key. Each is optional, as with envFrom.
            - name: EVE_INTERNAL_GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_GATEWAY_KEY
                  optional: true
            - name: EVE_INTERNAL_CALLER_HASHES
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_CALLER_HASHES
                  optional: true
            - name: EVE_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_API_KEY
                  optional: true
            - name: GATEWAY_PORT
              value: "4820"
            - name: EVE_API_URL
              value: http://eve-api:4701
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2

apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-api
  namespace: eve
  labels:
    app.kubernetes.io/name: eve-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-api
    spec:
      serviceAccountName: eve-api
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          securityContext:
            allowPrivilegeEscalation: false
          image: eve-horizon/api:local
          imagePullPolicy: IfNotPresent
          env:
            # Platform secrets: only the eve-app keys this service reads (no envFrom,
            # so a key added to eve-app reaches no service that does not name it),
            # as in k8s/base. Each is optional, as with envFrom, except the
            # registry credential key, which the API and the worker must share.
            - name: EVE_INTERNAL_CORE_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_CORE_KEY
                  optional: true
            - name: EVE_INTERNAL_DELIVER_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_DELIVER_KEY
                  optional: true
            - name: EVE_INTERNAL_CALLER_HASHES
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_CALLER_HASHES
                  optional: true
            - name: EVE_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_API_KEY
                  optional: true
            # Required: the API and the worker must read the same key (it may be
            # empty: both then sign with the internal key).
            - name: EVE_REGISTRY_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_REGISTRY_CREDENTIAL_KEY
            - name: EVE_REGISTRY_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_REGISTRY_SIGNING_KEY
                  optional: true
            - name: EVE_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_SECRETS_MASTER_KEY
                  optional: true
            - name: EVE_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_BOOTSTRAP_TOKEN
                  optional: true
            - name: EVE_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_GITHUB_WEBHOOK_SECRET
                  optional: true
            - name: EVE_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_AUTH_PRIVATE_KEY
                  optional: true
            - name: EVE_AUTH_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_AUTH_PUBLIC_KEY
                  optional: true
            - name: EVE_ORG_FS_LINK_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_ORG_FS_LINK_TOKEN_SECRET
                  optional: true
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: SUPABASE_JWT_SECRET
                  optional: true
            - name: SUPABASE_AUTH_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: SUPABASE_AUTH_SERVICE_KEY
                  optional: true
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: SUPABASE_ANON_KEY
                  optional: true
            - name: DATABASE_URL
              value: postgres://eve:eve@postgres.eve.svc.cluster.local:5432/eve
            - name: API_PORT
              value: "4701"
            - name: WORKER_URL
              value: http://eve-worker.eve.svc.cluster.local:4749
            # --- Web Auth (Supabase) ---
            - name: SUPABASE_AUTH_URL
              value: "http://supabase-auth.eve.svc.cluster.local:9999"
            - name: SUPABASE_AUTH_EXTERNAL_URL
              value: "http://auth.eve.lvh.me"
            - name: EVE_SSO_URL
              value: "http://sso.eve.lvh.me"
            # --- SMTP (Mailpit) ---
            - name: GOTRUE_SMTP_HOST
              value: "mailpit.eve.svc.cluster.local"
            - name: GOTRUE_SMTP_PORT
              value: "1025"
            - name: GOTRUE_SMTP_ADMIN_EMAIL
              value: "noreply@eve.local"
            - name: MAILER_FROM_ADDRESS
              value: "noreply@eve.local"
            - name: EVE_DEFAULT_DOMAIN
              value: lvh.me
          ports:
            - name: http
              containerPort: 4701
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10

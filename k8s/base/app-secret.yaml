apiVersion: v1
kind: Secret
metadata:
  name: eve-app
  namespace: eve
type: Opaque
# Platform-only secrets — infrastructure keys required by Eve services.
#
# Everything else (LLM API keys, GitHub tokens, GHCR credentials, etc.)
# flows through Eve org/project-level secrets, resolved at runtime via
# the secrets API. Never add provider credentials here.
stringData:
  # The platform database, with its password: read by the API, worker,
  # orchestrator, agent runtime and migrate Job. `bin/eh k8s deploy` sets it
  # from the eve-postgres Secret it makes for a new local install.
  DATABASE_URL: ""
  # Internal service keys. The core key is shared by the API, worker,
  # orchestrator and agent runtime; the gateway and the SSO have their own;
  # the deliver key is what the API sends the gateway (never the core key).
  # EVE_INTERNAL_CALLER_HASHES lists
  # `core:<sha256>,gateway:<sha256>,sso:<sha256>,deliver:<sha256>` of those
  # keys, for callees that accept a key without holding it.
  # `bin/eh k8s secrets` and `eve local up` generate all five.
  EVE_INTERNAL_CORE_KEY: ""
  EVE_INTERNAL_GATEWAY_KEY: ""
  EVE_INTERNAL_SSO_KEY: ""
  EVE_INTERNAL_DELIVER_KEY: ""
  EVE_INTERNAL_CALLER_HASHES: ""
  # Legacy shared key: sent beside the keys above, and accepted, until it is
  # removed (see docs/system/security-profiles.md, internal.service_key).
  EVE_INTERNAL_API_KEY: ""
  # Signs registry pull and push credentials (API and worker only).
  EVE_REGISTRY_CREDENTIAL_KEY: ""
  EVE_SECRETS_MASTER_KEY: ""
  EVE_BOOTSTRAP_TOKEN: ""
  EVE_GITHUB_WEBHOOK_SECRET: ""
  # Per-org OAuth credentials (Slack signing_secret, client_id/secret for Google/Slack)
  # are now stored in the oauth_app_configs table per org — no cluster-level secrets needed.
  # --- Supabase Auth (GoTrue) ---
  SUPABASE_JWT_SECRET: ""
  EVE_AUTH_ADMIN_PASSWORD: ""
  SUPABASE_AUTH_DATABASE_URL: ""
  SUPABASE_AUTH_SERVICE_KEY: ""
  SUPABASE_ANON_KEY: ""

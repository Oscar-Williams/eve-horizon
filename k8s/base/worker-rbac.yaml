# The worker's rights (0.1.328). Cluster-wide it handles namespaces and the
# RoleBindings that give it eve-worker-tenant; everything namespaced in the
# tenants' namespaces (workloads, Secrets, ConfigMaps, ingresses and policies)
# comes from eve-worker-tenant, bound per namespace: in runner-rbac.yaml in
# eve-runners, and by the worker in each namespace it creates or adopts (it
# labels those eve.horizon/managed=true). In the platform namespace (eve) it
# holds only the Role eve-worker below, never eve-worker-tenant: tenant code
# runs there too (kaniko builds, legacy pipeline steps in the worker), so
# nothing there may read the platform's Secrets, exec, or start workloads
# beyond runner pods and kaniko Jobs. The admission policies in k8s/admission
# hold the worker's writes everywhere (namespaces, RoleBindings, pods and
# their templates). Rollout order: these objects, the worker (its start-up
# reconcile labels and binds existing env namespaces), k8s/admission, then
# delete the old all-namespace ClusterRole and ClusterRoleBinding
# `eve-worker`, and the RoleBinding eve/eve-worker-tenant an earlier render
# of this file made. Rollback: re-apply the previous template (it brings
# `eve-worker` back) and delete k8s/admission; the objects below are then
# unused.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eve-worker
  namespace: eve
---
# What the worker does in the platform namespace, and nothing more:
# - plain runner pods for org filesystem jobs and their workspace claims
#   (kubectl apply: get, create, patch), read and removed by the reaper;
# - kaniko build Jobs, their pods (read for the build's outcome) and their
#   credentials Secret (kaniko-cfg-*), which it writes and removes but never
#   reads, so eve-app and the platform's other Secrets stay out of reach;
# - a registry Service's ClusterIP, read when an image names one here;
# - the runner egress policies of plain runner pods (eve-runner-<project>
#   NetworkPolicies, and GKE FQDN policies under egress.allow_hosts).
# No pods/exec (the worker never execs), no ConfigMaps, no Deployments.
# These verbs are by resource; eve-worker-platform-guard (k8s/admission)
# holds them to those objects by name and label, and
# eve-worker-runner-policy-guard the policies to the runner shape (labelled,
# egress only, selecting runner pods), so the platform's own Secrets, pods,
# claims, Jobs and policies stay out of reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eve-worker
  namespace: eve
rules:
  - apiGroups: [""]
    resources:
      - pods
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - create
      - delete
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: ["networking.gke.io"]
    resources:
      - fqdnnetworkpolicies
    verbs:
      - get
      - list
      - create
      - update
      - delete
---
# Namespaced rights, never bound cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eve-worker-tenant
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/status
      - persistentvolumeclaims
      - services
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - patch
      - update
  # No DaemonSets: the worker never makes one (the workload guard refuses
  # them too).
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - patch
      - update
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - patch
      - update
  # networkpolicies: egress.default_deny and network.ingress_isolation (env
  # namespaces' eve-egress* and eve-ingress*, the eve-runner-<project>
  # policies in the runner namespaces).
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - patch
      - update
  # egress.allow_hosts with EVE_EGRESS_FQDN_PROVIDER=gke: one GKE
  # FQDNNetworkPolicy per allowed host. Harmless where the CRD is absent.
  - apiGroups: ["networking.gke.io"]
    resources:
      - fqdnnetworkpolicies
    verbs:
      - get
      - list
      - create
      - delete
      - update
---
# Cluster-wide: namespaces (patch, not update: labels merge), the
# RoleBindings that hand the worker eve-worker-tenant, and bind on that role
# alone, so a RoleBinding can grant nothing else. No Secrets, no workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eve-worker-namespaces
rules:
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - rolebindings
    verbs:
      - create
      - get
      - list
      - delete
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
    verbs:
      - bind
    resourceNames:
      - eve-worker-tenant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eve-worker
  namespace: eve
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eve-worker
subjects:
  - kind: ServiceAccount
    name: eve-worker
    namespace: eve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eve-worker-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eve-worker-namespaces
subjects:
  - kind: ServiceAccount
    name: eve-worker
    namespace: eve

# The account runner pods run as. Job code needs no Kubernetes API, so the
# account has no token mount and no RoleBinding, and carries no cloud
# identity. Runner pods never run as a platform account (eve-worker,
# eve-agent-runtime), whose RBAC and Workload Identity job code would inherit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eve-runner
  namespace: eve
automountServiceAccountToken: false

apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-api
  namespace: eve
  labels:
    app.kubernetes.io/name: eve-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-api
    spec:
      serviceAccountName: eve-api
      # securityContext + probes injected by base kustomization patches/
      containers:
        - name: api
          image: eve-horizon/api:local
          imagePullPolicy: IfNotPresent
          env:
            # Platform secrets: only the eve-app keys this service reads (no envFrom,
            # so a key added to eve-app reaches no service that does not name it).
            # Each is optional, as with envFrom: a missing key leaves the variable
            # unset; the legacy EVE_INTERNAL_API_KEY is the fallback until it is removed.
            - name: EVE_INTERNAL_CORE_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_CORE_KEY
                  optional: true
            # Sent to the gateway with each delivery, in place of the core key.
            - name: EVE_INTERNAL_DELIVER_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_DELIVER_KEY
                  optional: true
            - name: EVE_INTERNAL_CALLER_HASHES
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_CALLER_HASHES
                  optional: true
            - name: EVE_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_API_KEY
                  optional: true
            - name: EVE_REGISTRY_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_REGISTRY_CREDENTIAL_KEY
                  optional: true
            - name: EVE_REGISTRY_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_REGISTRY_SIGNING_KEY
                  optional: true
            - name: EVE_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_SECRETS_MASTER_KEY
                  optional: true
            - name: EVE_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_BOOTSTRAP_TOKEN
                  optional: true
            - name: EVE_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_GITHUB_WEBHOOK_SECRET
                  optional: true
            - name: EVE_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_AUTH_PRIVATE_KEY
                  optional: true
            - name: EVE_AUTH_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_AUTH_PUBLIC_KEY
                  optional: true
            - name: EVE_ORG_FS_LINK_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_ORG_FS_LINK_TOKEN_SECRET
                  optional: true
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: SUPABASE_JWT_SECRET
                  optional: true
            - name: SUPABASE_AUTH_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: SUPABASE_AUTH_SERVICE_KEY
                  optional: true
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: SUPABASE_ANON_KEY
                  optional: true
            # Shared cluster values come from the eve-cluster-config ConfigMap.
            # (No envFrom here: the api must not inherit EVE_API_URL from it.)
            # The database URL is a secret (eve-app), not ConfigMap data.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: DATABASE_URL
                  optional: true
            - name: API_PORT
              value: "4701"
            # /internal/* answers only on this port; the public port (the
            # Ingress) answers 404 for it, except the registry token realm.
            # Platform services reach the API here via EVE_API_URL.
            - name: EVE_API_INTERNAL_PORT
              value: "4791"
            - name: WORKER_URL
              value: http://eve-worker.eve.svc.cluster.local:4749
            # --- Web Auth (Supabase) ---
            - name: SUPABASE_AUTH_URL
              value: "http://supabase-auth.eve.svc.cluster.local:9999"
            - name: SUPABASE_AUTH_EXTERNAL_URL
              value: "http://auth.eve.lvh.me"
            - name: EVE_SSO_URL
              valueFrom:
                configMapKeyRef:
                  name: eve-cluster-config
                  key: EVE_SSO_URL
            - name: EVE_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: eve-cluster-config
                  key: EVE_PUBLIC_API_URL
            # --- SMTP (Mailpit locally; staging overrides in infra repo) ---
            - name: GOTRUE_SMTP_HOST
              value: "mailpit.eve.svc.cluster.local"
            - name: GOTRUE_SMTP_PORT
              value: "1025"
            - name: GOTRUE_SMTP_ADMIN_EMAIL
              value: "noreply@eve.local"
            - name: MAILER_FROM_ADDRESS
              value: "noreply@eve.local"
            - name: EVE_GATEWAY_URL
              value: "http://eve-gateway.eve.svc.cluster.local:4820"
            - name: EVE_DEFAULT_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: eve-cluster-config
                  key: EVE_DEFAULT_DOMAIN
            # --- Object Storage (credentials from minio-credentials Secret) ---
            - name: EVE_STORAGE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: eve-cluster-config
                  key: EVE_STORAGE_BACKEND
            - name: EVE_STORAGE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: eve-cluster-config
                  key: EVE_STORAGE_ENDPOINT
            - name: EVE_STORAGE_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: eve-cluster-config
                  key: EVE_STORAGE_PUBLIC_ENDPOINT
            - name: EVE_STORAGE_REGION
              valueFrom:
                configMapKeyRef:
                  name: eve-cluster-config
                  key: EVE_STORAGE_REGION
            - name: EVE_STORAGE_ORG_BUCKET_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: eve-cluster-config
                  key: EVE_STORAGE_ORG_BUCKET_PREFIX
            - name: EVE_STORAGE_INTERNAL_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: eve-cluster-config
                  key: EVE_STORAGE_INTERNAL_BUCKET
            - name: EVE_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: EVE_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
          ports:
            - name: http
              containerPort: 4701
            - name: internal
              containerPort: 4791

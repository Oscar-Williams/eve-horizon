apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-gateway
  namespace: eve
  labels:
    app.kubernetes.io/name: eve-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-gateway
    spec:
      # securityContext injected by base kustomization patches/
      # (probes stay inline: gateway uses timeoutSeconds, unlike the standard pair)
      containers:
        - name: gateway
          image: eve-horizon/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4820
          env:
            # Platform secrets: the gateway's own key, and the hashes of the keys it
            # accepts (the core key, for deliveries). No database URL and no core key.
            # Each is optional, as with envFrom; the legacy EVE_INTERNAL_API_KEY is
            # the fallback until it is removed.
            - name: EVE_INTERNAL_GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_GATEWAY_KEY
                  optional: true
            - name: EVE_INTERNAL_CALLER_HASHES
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_CALLER_HASHES
                  optional: true
            - name: EVE_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_API_KEY
                  optional: true
            - name: GATEWAY_PORT
              value: "4820"
            - name: EVE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: eve-cluster-config
                  key: EVE_API_URL
            # POST /gateway/providers/simulate (eve chat simulate) is for
            # development and tests; the local overlay turns it on.
            - name: EVE_SIMULATE_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2

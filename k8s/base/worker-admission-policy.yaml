# The worker's namespace guard (0.1.328): what the worker's own service
# account may write, whatever its RBAC says. Needs ValidatingAdmissionPolicy
# (GA in Kubernetes 1.30). Apply it after the worker has run its start-up
# reconcile (which labels the env namespaces of earlier releases), or their
# deploys are refused until it does.
#
# - Namespaced objects only in namespaces labelled eve.horizon/managed=true,
#   and in the platform's static namespaces (eve, eve-runners, eve-builds).
# - No cluster-scoped object but namespaces.
# - A namespace is created with the managed label; changed only when it has
#   that label or Eve's older ownership label (eve.env_id), so the worker can
#   adopt its own env namespaces and nothing else; deleted only when managed,
#   and never a static one.
# - RoleBindings only to the ClusterRole eve-worker-tenant, for the worker
#   alone (created, or deleted, in either form).
#
# Cluster-scoped: kustomize stamps a namespace on it in overlays that set
# one; the API server ignores it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: eve-worker-namespace-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*/*"]
  matchConditions:
    - name: the-worker
      expression: "request.userInfo.username == 'system:serviceaccount:eve:eve-worker'"
  variables:
    - name: staticNamespaces
      expression: "['eve', 'eve-runners', 'eve-builds']"
    - name: isNamespace
      expression: "request.resource.group == '' && request.resource.resource == 'namespaces'"
    - name: isRoleBinding
      expression: "request.resource.group == 'rbac.authorization.k8s.io' && request.resource.resource == 'rolebindings'"
    - name: hostLabels
      expression: >-
        namespaceObject != null && has(namespaceObject.metadata.labels) ? namespaceObject.metadata.labels : {}
    - name: inManagedNamespace
      expression: >-
        request.namespace in variables.staticNamespaces ||
        ('eve.horizon/managed' in variables.hostLabels && variables.hostLabels['eve.horizon/managed'] == 'true')
    - name: newLabels
      expression: "object != null && has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldLabels
      expression: "oldObject != null && has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: newManaged
      expression: "'eve.horizon/managed' in variables.newLabels && variables.newLabels['eve.horizon/managed'] == 'true'"
    - name: oldManaged
      expression: "'eve.horizon/managed' in variables.oldLabels && variables.oldLabels['eve.horizon/managed'] == 'true'"
    - name: oldEnvOwned
      expression: "'eve.env_id' in variables.oldLabels"
    - name: binding
      expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
    - expression: "variables.isNamespace || request.namespace != ''"
      message: "The Eve worker writes no cluster-scoped object but namespaces"
    - expression: "variables.isNamespace || request.namespace == '' || variables.inManagedNamespace"
      message: "The Eve worker writes only in namespaces labelled eve.horizon/managed=true and in the platform's own"
    - expression: "!variables.isNamespace || request.operation != 'CREATE' || variables.newManaged"
      message: "A namespace the Eve worker creates carries eve.horizon/managed=true"
    - expression: >-
        !variables.isNamespace || request.operation != 'UPDATE' ||
        (!(request.name in variables.staticNamespaces) && (variables.oldManaged || variables.oldEnvOwned))
      message: "The Eve worker changes only namespaces it manages (eve.horizon/managed=true) or env namespaces an earlier release made (eve.env_id)"
    - expression: >-
        !variables.isNamespace || request.operation != 'DELETE' ||
        (!(request.name in variables.staticNamespaces) && variables.oldManaged)
      message: "The Eve worker deletes only namespaces labelled eve.horizon/managed=true"
    - expression: >-
        !variables.isRoleBinding || (
          variables.binding.roleRef.kind == 'ClusterRole' &&
          variables.binding.roleRef.name == 'eve-worker-tenant' &&
          has(variables.binding.subjects) && variables.binding.subjects.size() == 1 &&
          variables.binding.subjects[0].kind == 'ServiceAccount' &&
          variables.binding.subjects[0].name == 'eve-worker' &&
          'namespace' in variables.binding.subjects[0] &&
          variables.binding.subjects[0]['namespace'] == 'eve')
      message: "The Eve worker binds only the ClusterRole eve-worker-tenant, for itself"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: eve-worker-namespace-guard
spec:
  policyName: eve-worker-namespace-guard
  validationActions: [Deny]

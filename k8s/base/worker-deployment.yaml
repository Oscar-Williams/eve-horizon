apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-worker
  namespace: eve
  labels:
    app.kubernetes.io/name: eve-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-worker
    spec:
      serviceAccountName: eve-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # container securityContext + probes injected by base kustomization patches/
      containers:
        - name: worker
          image: eve-horizon/worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            # Cluster-wide config (DATABASE_URL, service URLs, EVE_STORAGE_*).
            # Inline env entries below override these if names collide.
            - configMapRef:
                name: eve-cluster-config
          env:
            # Platform secrets: only the eve-app keys this service reads (no envFrom,
            # so a key added to eve-app reaches no service that does not name it).
            # Each is optional, as with envFrom: a missing key leaves the variable
            # unset; the legacy EVE_INTERNAL_API_KEY is the fallback until it is removed.
            - name: EVE_INTERNAL_CORE_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_CORE_KEY
                  optional: true
            - name: EVE_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_INTERNAL_API_KEY
                  optional: true
            - name: EVE_REGISTRY_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_REGISTRY_CREDENTIAL_KEY
                  optional: true
            - name: EVE_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eve-app
                  key: EVE_GITHUB_TOKEN
                  optional: true
            - name: EVE_RUNTIME
              value: k8s
            - name: EVE_K8S_NAMESPACE
              value: eve
            - name: EVE_BUILDKIT_ADDR
              value: tcp://buildkitd.eve.svc:1234
            # Image used for spawning runner pods in the Kubernetes cluster
            - name: EVE_RUNNER_IMAGE
              value: eve-horizon/worker:local
            # Runner pods run as eve-runner: no token, no RBAC, no cloud identity.
            - name: EVE_RUNNER_SERVICE_ACCOUNT
              value: eve-runner
            # Runner pods, sandbox templates and claims live in their own namespace
            # (Pod Security restricted). Org-filesystem jobs stay in eve.
            - name: EVE_RUNNER_NAMESPACE
              value: eve-runners
            # Runner pods report to the API's public port, by its cluster name
            # (they are not in eve, and never get the internal port).
            - name: EVE_API_APP_URL
              value: http://eve-api.eve.svc.cluster.local:4701
            # Refuse to start if job processes could read this process's environment.
            - name: EVE_REQUIRE_ENVIRON_PROTECTION
              value: "true"
            - name: WORKER_PORT
              value: "4749"
            - name: EVE_ORG_FS_ROOT
              value: /org
            - name: EVE_TOOLCHAIN_ROOT
              value: /opt/eve/toolchains
            - name: EVE_TOOLCHAIN_IMAGE_PREFIX
              value: eve-horizon/toolchain-
            - name: EVE_TOOLCHAIN_IMAGE_TAG
              value: local
            # --- Object Storage credentials (endpoint config from eve-cluster-config) ---
            - name: EVE_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
                  optional: true
            - name: EVE_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
                  optional: true
          ports:
            - name: http
              containerPort: 4749
          # Liveness (standard-probes patch) only starts once this passes, so a
          # slow first start is not killed. Budget: 60 x 5s = 5 minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: toolchains
              mountPath: /opt/eve/toolchains
      volumes:
        - name: toolchains
          emptyDir: {}

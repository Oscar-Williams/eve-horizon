apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The admission policies that hold the worker's and the orchestrator's writes
# (Kubernetes 1.30 or later). Applied on their own, after k8s/base and after
# the worker's rollout: its start-up reconcile labels and binds the env
# namespaces of earlier releases, which the worker's guard otherwise refuses
# to deploy into. `bin/eh k8s deploy` applies this once the worker is ready;
# elsewhere: `kubectl apply -k k8s/base`, wait for the worker's log line
# "Managed namespaces reconciled", then `kubectl apply -k k8s/admission`.
resources:
  - worker-admission-policy.yaml
  - orchestrator-admission-policy.yaml

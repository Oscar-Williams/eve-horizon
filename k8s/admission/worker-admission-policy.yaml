# The worker's guards (0.1.328): what the worker's own service account may
# write, whatever its RBAC says. Needs ValidatingAdmissionPolicy (GA in
# Kubernetes 1.30). Part of k8s/admission, applied after the worker has run
# its start-up reconcile (which labels the env namespaces of earlier
# releases), or their deploys are refused until it does.
#
# eve-worker-namespace-guard, on every write:
# - Namespaced objects only in namespaces labelled eve.horizon/managed=true,
#   and in the platform's static namespaces (eve, eve-runners, eve-builds).
# - No cluster-scoped object but namespaces.
# - A namespace is created with the managed label; changed only when it has
#   that label or Eve's older ownership label (eve.env_id), so the worker can
#   adopt its own env namespaces and nothing else; deleted only when managed,
#   and never a static one. Never set Pod Security enforce=privileged (one an
#   operator set stays, and the worker can still change other labels).
# - RoleBindings only to the ClusterRole eve-worker-tenant, for the worker
#   alone (created, or deleted, in either form), and none at all in the static
#   namespaces: their rights come from the template (in eve, a binding of
#   eve-worker-tenant would give back the platform's Secrets).
# - No service account token Secret (it would mint a token for any account).
#
# eve-worker-workload-guard, on pods (ephemeral containers added through
# their subresource included) and every pod template it writes (Deployments,
# ReplicaSets, StatefulSets, Jobs, CronJobs, agent-sandbox SandboxTemplates),
# in every namespace:
# - no DaemonSet at all (the worker never makes one);
# - nothing Pod Security baseline refuses, in any container (init and
#   ephemeral ones included) or at pod level: no privileged container, host
#   namespace (hostNetwork, hostPID, hostIPC), Windows host process, hostPath
#   volume, hostPort, capability beyond baseline's, seccomp or AppArmor
#   Unconfined (field or annotation, seccomp's alpha annotations included),
#   unmasked /proc, sysctl outside the safe set, or SELinux type, user or
#   role beyond baseline's;
# - the service account is default, eve-runner, or (outside the platform
#   namespace) an app account: eve-app (IRSA) or eve-app-<env> (GKE Workload
#   Identity). x-eve.networking.egress: stable on EKS (hostNetwork) is
#   refused: drop that rule in the instance overlay to run it.
# - no ephemeral volume (its claim template could clone any claim in the
#   namespace, and the claim is made by a controller, not the worker);
# - in the platform namespace, where only runner pods (org filesystem jobs)
#   and kaniko builds belong: no workload name label (app.kubernetes.io/name,
#   app, which name the platform's own pods to network policies), no Secret
#   but kaniko-cfg-*, no claim but eve-ws-* and eve-org-fs-*.
#
# eve-worker-platform-guard, on every write in the platform namespace (eve),
# where the platform's own pods, Secrets, volumes and policies live: the
# worker writes there only what it makes there, judged by name or label on
# the object before the write (update, delete) and after it (create, update):
# - Secrets named kaniko-cfg-* (a kaniko build's credentials);
# - claims named eve-ws-* (runner workspaces) that clone or bind no existing
#   volume (no dataSource, dataSourceRef, volumeName or selector, and a
#   volumeName never changed); never the org filesystem's (eve-org-fs-*),
#   which runner pods only mount;
# - pods labelled eve.type=runner (plain runner pods) or
#   eve.horizon/component=kaniko-build, and Jobs with that kaniko label;
# - runner egress policies (NetworkPolicies and GKE FQDN policies), held to
#   their shape by eve-worker-runner-policy-guard;
# - nothing else.
#
# eve-worker-runner-policy-guard, on every write of a NetworkPolicy or GKE
# FQDN policy in the runner namespaces (eve-runners, and eve for plain runner
# pods): the worker writes there only the policies runnerEgressPolicies and
# runnerFqdnPolicies (packages/shared/src/k8s) make:
# - labelled eve.horizon/egress, before the write (update, delete) and after
#   it (create, update), so the static eve-runner-deny and eve-runner-ingress
#   and the platform's own policies stay out of reach;
# - selecting only runner pods (podSelector.matchLabels
#   eve.horizon/runner=true), never a platform pod;
# - egress only (policyTypes [Egress], none for an FQDN policy, and no
#   ingress rules), so no policy of the worker's opens a way in to any pod.
#
# Cluster-scoped: kustomize stamps a namespace on them in overlays that set
# one; the API server ignores it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: eve-worker-namespace-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*/*"]
  matchConditions:
    - name: the-worker
      expression: "request.userInfo.username == 'system:serviceaccount:eve:eve-worker'"
  variables:
    - name: staticNamespaces
      expression: "['eve', 'eve-runners', 'eve-builds']"
    - name: isNamespace
      expression: "request.resource.group == '' && request.resource.resource == 'namespaces'"
    - name: isRoleBinding
      expression: "request.resource.group == 'rbac.authorization.k8s.io' && request.resource.resource == 'rolebindings'"
    - name: isSecret
      expression: "request.resource.group == '' && request.resource.resource == 'secrets'"
    - name: hostLabels
      expression: >-
        namespaceObject != null && has(namespaceObject.metadata.labels) ? namespaceObject.metadata.labels : {}
    - name: inManagedNamespace
      expression: >-
        request.namespace in variables.staticNamespaces ||
        ('eve.horizon/managed' in variables.hostLabels && variables.hostLabels['eve.horizon/managed'] == 'true')
    - name: newLabels
      expression: "object != null && has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldLabels
      expression: "oldObject != null && has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: newManaged
      expression: "'eve.horizon/managed' in variables.newLabels && variables.newLabels['eve.horizon/managed'] == 'true'"
    - name: oldManaged
      expression: "'eve.horizon/managed' in variables.oldLabels && variables.oldLabels['eve.horizon/managed'] == 'true'"
    - name: oldEnvOwned
      expression: "'eve.env_id' in variables.oldLabels"
    - name: binding
      expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
    - expression: "variables.isNamespace || request.namespace != ''"
      message: "The Eve worker writes no cluster-scoped object but namespaces"
    - expression: "variables.isNamespace || request.namespace == '' || variables.inManagedNamespace"
      message: "The Eve worker writes only in namespaces labelled eve.horizon/managed=true and in the platform's own"
    - expression: "!variables.isNamespace || request.operation != 'CREATE' || variables.newManaged"
      message: "A namespace the Eve worker creates carries eve.horizon/managed=true"
    - expression: >-
        !variables.isNamespace || request.operation != 'UPDATE' ||
        (!(request.name in variables.staticNamespaces) && (variables.oldManaged || variables.oldEnvOwned))
      message: "The Eve worker changes only namespaces it manages (eve.horizon/managed=true) or env namespaces an earlier release made (eve.env_id)"
    - expression: >-
        !variables.isNamespace || request.operation != 'DELETE' ||
        (!(request.name in variables.staticNamespaces) && variables.oldManaged)
      message: "The Eve worker deletes only namespaces labelled eve.horizon/managed=true"
    - expression: >-
        !variables.isRoleBinding || (
          variables.binding.roleRef.kind == 'ClusterRole' &&
          variables.binding.roleRef.name == 'eve-worker-tenant' &&
          has(variables.binding.subjects) && variables.binding.subjects.size() == 1 &&
          variables.binding.subjects[0].kind == 'ServiceAccount' &&
          variables.binding.subjects[0].name == 'eve-worker' &&
          'namespace' in variables.binding.subjects[0] &&
          variables.binding.subjects[0]['namespace'] == 'eve')
      message: "The Eve worker binds only the ClusterRole eve-worker-tenant, for itself"
    - expression: "!variables.isRoleBinding || !(request.namespace in variables.staticNamespaces)"
      message: "The Eve worker makes or removes no RoleBinding in the platform's static namespaces (eve, eve-runners, eve-builds): their rights come from the template"
    - expression: >-
        !variables.isSecret || request.operation == 'DELETE' ||
        !has(object.type) || object.type != 'kubernetes.io/service-account-token'
      message: "The Eve worker creates no service account token Secret"
    - expression: >-
        !variables.isNamespace || request.operation == 'DELETE' ||
        !('pod-security.kubernetes.io/enforce' in variables.newLabels) ||
        variables.newLabels['pod-security.kubernetes.io/enforce'] != 'privileged' ||
        ('pod-security.kubernetes.io/enforce' in variables.oldLabels &&
         variables.oldLabels['pod-security.kubernetes.io/enforce'] == 'privileged')
      message: "The Eve worker never sets Pod Security enforce to privileged"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: eve-worker-namespace-guard
spec:
  policyName: eve-worker-namespace-guard
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: eve-worker-workload-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # pods/ephemeralcontainers: no role of the worker's grants it; if one
      # ever does, the containers it adds are judged like any other.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
      - apiGroups: ["extensions.agents.x-k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxtemplates"]
  matchConditions:
    - name: the-worker
      expression: "request.userInfo.username == 'system:serviceaccount:eve:eve-worker'"
  variables:
    - name: resource
      expression: "request.resource.resource"
    - name: template
      expression: >-
        variables.resource == 'pods' ? object :
        variables.resource == 'cronjobs' ? object.spec.jobTemplate.spec.template :
        variables.resource == 'sandboxtemplates' ? object.spec.podTemplate :
        object.spec.template
    - name: podSpec
      expression: "variables.template.spec"
    - name: podLabels
      expression: >-
        has(variables.template.metadata) && has(variables.template.metadata.labels) ? variables.template.metadata.labels : {}
    - name: podAnnotations
      expression: >-
        has(variables.template.metadata) && has(variables.template.metadata.annotations) ? variables.template.metadata.annotations : {}
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []) +
        (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : [])
    # The pod's security context and each container's: the fields baseline
    # checks at both levels share their names.
    - name: securityContexts
      expression: >-
        (has(variables.podSpec.securityContext) ? [variables.podSpec.securityContext] : []) +
        variables.containers.filter(c, has(c.securityContext)).map(c, c.securityContext)
    - name: volumes
      expression: "has(variables.podSpec.volumes) ? variables.podSpec.volumes : []"
    - name: inPlatform
      expression: "request.namespace == 'eve'"
    - name: accounts
      expression: >-
        [has(variables.podSpec.serviceAccountName) ? variables.podSpec.serviceAccountName : '',
         has(variables.podSpec.serviceAccount) ? variables.podSpec.serviceAccount : '']
  validations:
    - expression: "variables.resource != 'daemonsets'"
      message: "The Eve worker creates no DaemonSet"
    # Before the host namespaces: the API refuses a host process without
    # hostNetwork, and the first refusal is the one reported.
    - expression: >-
        variables.securityContexts.all(sc, !has(sc.windowsOptions) ||
        !has(sc.windowsOptions.hostProcess) || !sc.windowsOptions.hostProcess)
      message: "Pods the Eve worker writes run no Windows host process (windowsOptions.hostProcess)"
    - expression: >-
        !(has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork) &&
        !(has(variables.podSpec.hostPID) && variables.podSpec.hostPID) &&
        !(has(variables.podSpec.hostIPC) && variables.podSpec.hostIPC)
      message: "Pods the Eve worker writes use no host namespace (hostNetwork, hostPID, hostIPC)"
    - expression: "variables.volumes.all(v, !has(v.hostPath))"
      message: "Pods the Eve worker writes mount no hostPath volume"
    - expression: "variables.volumes.all(v, !has(v.ephemeral))"
      message: "Pods the Eve worker writes have no ephemeral volume (its claim template could clone another claim)"
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) ||
        !has(c.securityContext.privileged) || !c.securityContext.privileged)
      message: "Pods the Eve worker writes run no privileged container"
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) ||
        !has(c.securityContext.capabilities.add) ||
        c.securityContext.capabilities.add.all(x, x in ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER',
        'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']))
      message: "Pods the Eve worker writes add no capabilities beyond Pod Security baseline"
    - expression: "variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))"
      message: "Pods the Eve worker writes use no hostPort"
    - expression: >-
        variables.securityContexts.all(sc, !has(sc.seccompProfile) ||
        sc.seccompProfile.type in ['RuntimeDefault', 'Localhost']) &&
        variables.podAnnotations.all(k, (k != 'seccomp.security.alpha.kubernetes.io/pod' &&
        !k.startsWith('container.seccomp.security.alpha.kubernetes.io/')) ||
        variables.podAnnotations[k] in ['runtime/default', 'docker/default'] || variables.podAnnotations[k].startsWith('localhost/'))
      message: "Pods the Eve worker writes run nothing with seccomp Unconfined (seccompProfile, or the seccomp.security.alpha.kubernetes.io annotations)"
    - expression: >-
        variables.securityContexts.all(sc, !has(sc.appArmorProfile) ||
        sc.appArmorProfile.type in ['RuntimeDefault', 'Localhost']) &&
        variables.podAnnotations.all(k, !k.startsWith('container.apparmor.security.beta.kubernetes.io/') ||
        variables.podAnnotations[k] == 'runtime/default' || variables.podAnnotations[k].startsWith('localhost/'))
      message: "Pods the Eve worker writes run nothing with AppArmor Unconfined (appArmorProfile, or the container.apparmor.security.beta.kubernetes.io annotation)"
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.procMount) ||
        c.securityContext.procMount == 'Default')
      message: "Pods the Eve worker writes leave /proc masked (procMount Default)"
    - expression: >-
        !has(variables.podSpec.securityContext) || !has(variables.podSpec.securityContext.sysctls) ||
        variables.podSpec.securityContext.sysctls.all(x, x.name in ['kernel.shm_rmid_forced',
        'net.ipv4.ip_local_port_range', 'net.ipv4.ip_local_reserved_ports', 'net.ipv4.ip_unprivileged_port_start',
        'net.ipv4.tcp_syncookies', 'net.ipv4.ping_group_range', 'net.ipv4.tcp_keepalive_time',
        'net.ipv4.tcp_fin_timeout', 'net.ipv4.tcp_keepalive_intvl', 'net.ipv4.tcp_keepalive_probes',
        'net.ipv4.tcp_rmem', 'net.ipv4.tcp_wmem'])
      message: "Pods the Eve worker writes set only the sysctls Pod Security baseline allows"
    - expression: >-
        variables.securityContexts.all(sc, !has(sc.seLinuxOptions) || (
        (!has(sc.seLinuxOptions.type) || sc.seLinuxOptions.type in
          ['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t']) &&
        (!has(sc.seLinuxOptions.user) || sc.seLinuxOptions.user == '') &&
        (!has(sc.seLinuxOptions.role) || sc.seLinuxOptions.role == '')))
      message: "Pods the Eve worker writes set no SELinux type, user or role beyond Pod Security baseline"
    - expression: >-
        variables.accounts.all(sa, sa in ['', 'default', 'eve-runner'] ||
        (!variables.inPlatform && (sa == 'eve-app' || sa.startsWith('eve-app-'))))
      message: "Pods the Eve worker writes run as default, eve-runner, or outside the platform namespace an app account (eve-app, eve-app-<env>)"
    - expression: >-
        !variables.inPlatform ||
        (!('app.kubernetes.io/name' in variables.podLabels) && !('app' in variables.podLabels))
      message: "Pods the Eve worker writes in the platform namespace carry no workload name label (app.kubernetes.io/name, app): those name the platform's own pods"
    - expression: >-
        !variables.inPlatform || (
          variables.volumes.all(v,
            (!has(v.secret) || (has(v.secret.secretName) && v.secret.secretName.startsWith('kaniko-cfg-'))) &&
            (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(src,
              !has(src.secret) || (has(src.secret.name) && src.secret.name.startsWith('kaniko-cfg-'))))) &&
          variables.containers.all(c,
            (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
              (has(e.valueFrom.secretKeyRef.name) && e.valueFrom.secretKeyRef.name.startsWith('kaniko-cfg-')))) &&
            (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef) ||
              (has(f.secretRef.name) && f.secretRef.name.startsWith('kaniko-cfg-'))))))
      message: "Pods the Eve worker writes in the platform namespace read no Secret but their kaniko build credentials (kaniko-cfg-*)"
    - expression: >-
        !variables.inPlatform || variables.volumes.all(v, !has(v.persistentVolumeClaim) ||
        v.persistentVolumeClaim.claimName.startsWith('eve-ws-') ||
        v.persistentVolumeClaim.claimName.startsWith('eve-org-fs-'))
      message: "Pods the Eve worker writes in the platform namespace mount only runner workspaces (eve-ws-*) and the org filesystem (eve-org-fs-*)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: eve-worker-workload-guard
spec:
  policyName: eve-worker-workload-guard
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: eve-worker-platform-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*/*"]
  matchConditions:
    - name: the-worker
      expression: "request.userInfo.username == 'system:serviceaccount:eve:eve-worker'"
    - name: in-the-platform-namespace
      expression: "request.namespace == 'eve'"
  variables:
    - name: kind
      expression: "request.resource.group + '/' + request.resource.resource"
    # What the write leaves (create, update) and what it changes (update,
    # delete): each must pass.
    - name: checksNew
      expression: "request.operation != 'DELETE'"
    - name: checksOld
      expression: "request.operation != 'CREATE'"
    - name: name
      expression: "variables.checksNew ? object.metadata.name : oldObject.metadata.name"
    - name: newLabels
      expression: "variables.checksNew && has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldLabels
      expression: "variables.checksOld && has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: newIsKaniko
      expression: "'eve.horizon/component' in variables.newLabels && variables.newLabels['eve.horizon/component'] == 'kaniko-build'"
    - name: oldIsKaniko
      expression: "'eve.horizon/component' in variables.oldLabels && variables.oldLabels['eve.horizon/component'] == 'kaniko-build'"
    - name: newIsRunner
      expression: "'eve.type' in variables.newLabels && variables.newLabels['eve.type'] == 'runner'"
    - name: oldIsRunner
      expression: "'eve.type' in variables.oldLabels && variables.oldLabels['eve.type'] == 'runner'"
  validations:
    - expression: >-
        variables.kind in ['/secrets', '/persistentvolumeclaims', '/pods', 'batch/jobs',
        'networking.k8s.io/networkpolicies', 'networking.gke.io/fqdnnetworkpolicies']
      message: "In the platform namespace the Eve worker writes only kaniko build Secrets and Jobs, runner pods and claims, and runner egress policies"
    - expression: "variables.kind != '/secrets' || variables.name.startsWith('kaniko-cfg-')"
      message: "In the platform namespace the Eve worker writes no Secret but kaniko build credentials (kaniko-cfg-*)"
    - expression: "variables.kind != '/persistentvolumeclaims' || variables.name.startsWith('eve-ws-')"
      message: "In the platform namespace the Eve worker writes no claim but runner workspaces (eve-ws-*): the org filesystem's (eve-org-fs-*) it only mounts"
    - expression: >-
        variables.kind != '/persistentvolumeclaims' || request.operation != 'CREATE' ||
        (!has(object.spec.dataSource) && !has(object.spec.dataSourceRef) &&
         !has(object.spec.volumeName) && !has(object.spec.selector))
      message: "In the platform namespace a claim the Eve worker creates clones and binds no existing volume (dataSource, dataSourceRef, volumeName, selector)"
    - expression: >-
        variables.kind != '/persistentvolumeclaims' || request.operation != 'UPDATE' ||
        (has(object.spec.volumeName) ? object.spec.volumeName : '') ==
        (has(oldObject.spec.volumeName) ? oldObject.spec.volumeName : '')
      message: "In the platform namespace the Eve worker never changes a claim's volumeName"
    - expression: >-
        variables.kind != '/pods' ||
        ((!variables.checksNew || variables.newIsRunner || variables.newIsKaniko) &&
         (!variables.checksOld || variables.oldIsRunner || variables.oldIsKaniko))
      message: "In the platform namespace the Eve worker writes only runner pods (eve.type=runner) and kaniko build pods (eve.horizon/component=kaniko-build)"
    - expression: >-
        variables.kind != 'batch/jobs' ||
        ((!variables.checksNew || variables.newIsKaniko) && (!variables.checksOld || variables.oldIsKaniko))
      message: "In the platform namespace the Eve worker writes only kaniko build Jobs (eve.horizon/component=kaniko-build)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: eve-worker-platform-guard
spec:
  policyName: eve-worker-platform-guard
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: eve-worker-runner-policy-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
      - apiGroups: ["networking.gke.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["fqdnnetworkpolicies"]
  matchConditions:
    - name: the-worker
      expression: "request.userInfo.username == 'system:serviceaccount:eve:eve-worker'"
    - name: in-a-runner-namespace
      expression: "request.namespace in ['eve', 'eve-runners']"
  variables:
    - name: checksNew
      expression: "request.operation != 'DELETE'"
    - name: checksOld
      expression: "request.operation != 'CREATE'"
    - name: newLabels
      expression: "variables.checksNew && has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldLabels
      expression: "variables.checksOld && has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    # FQDN policies are egress only and carry no policyTypes;
    # NetworkPolicies always do (the API server defaults them).
    - name: isFqdn
      expression: "request.resource.group == 'networking.gke.io'"
  validations:
    - expression: >-
        (!variables.checksNew || 'eve.horizon/egress' in variables.newLabels) &&
        (!variables.checksOld || 'eve.horizon/egress' in variables.oldLabels)
      message: "In the runner namespaces the Eve worker writes only its own runner policies (labelled eve.horizon/egress), never the static eve-runner-deny and eve-runner-ingress or the platform's policies"
    - expression: >-
        !variables.checksNew || (
          has(object.spec) && has(object.spec.podSelector) && has(object.spec.podSelector.matchLabels) &&
          'eve.horizon/runner' in object.spec.podSelector.matchLabels &&
          object.spec.podSelector.matchLabels['eve.horizon/runner'] == 'true')
      message: "In the runner namespaces the Eve worker's policies select only runner pods (podSelector.matchLabels eve.horizon/runner=true)"
    - expression: >-
        !variables.checksNew || (has(object.spec) &&
          (has(object.spec.policyTypes) ? object.spec.policyTypes == ['Egress'] : variables.isFqdn) &&
          (!has(object.spec.ingress) || object.spec.ingress.size() == 0))
      message: "In the runner namespaces the Eve worker's policies are egress only (policyTypes [Egress], no ingress rules)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: eve-worker-runner-policy-guard
spec:
  policyName: eve-worker-runner-policy-guard
  validationActions: [Deny]

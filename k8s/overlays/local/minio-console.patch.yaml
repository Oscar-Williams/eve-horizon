# Local only: the MinIO console on :9001, behind storage-console.eve.lvh.me
# (minio-ingress.yaml). Base runs MinIO with the console off.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eve-minio
  namespace: eve
spec:
  template:
    spec:
      containers:
        - name: minio
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_BROWSER
              value: "on"
          ports:
            - name: console
              containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: eve-minio
  namespace: eve
spec:
  ports:
    - name: console
      port: 9001
      targetPort: 9001

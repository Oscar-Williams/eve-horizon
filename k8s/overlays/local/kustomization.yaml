apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # Local-only: mail catcher and object storage hosts on *.eve.lvh.me.
  - mailpit-ingress.yaml
  - minio-ingress.yaml
# Base names every namespace itself (eve, and eve-runners for runner pods);
# a namespace transform here would fold eve-runners into eve.
# namespace: eve
patchesStrategicMerge:
  - postgres.patch.yaml
  - agent-runtime-pvc.patch.yaml
  - agent-runtime-org-id.patch.yaml
  - managed-db.patch.yaml

  - api-tcp-ingress.patch.yaml
  - api-dev-bootstrap.patch.yaml
  - worker-registry.patch.yaml
  - worker-tcp-ingress.patch.yaml
  - supabase-auth-autoconfirm.patch.yaml
  - gateway-simulate.patch.yaml
  - minio-console.patch.yaml
